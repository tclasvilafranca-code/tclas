services:
  - name: tclas-api
    type: web
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install && npx prisma generate && (npx prisma migrate deploy || (npx prisma db push --force-reset --accept-data-loss && npx prisma migrate resolve --applied 20260708110452_init)) && npm run build
    startCommand: npm run seed && node dist/index.js
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false

  - name: tclas-web
    type: web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
