services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: teorico48
      POSTGRES_PASSWORD: teorico48
      POSTGRES_DB: teorico48
    ports:
      - "5433:5432"
    volumes:
      - teorico48_db_data:/var/lib/postgresql/data

volumes:
  teorico48_db_data:
