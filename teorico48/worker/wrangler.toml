name = "teorico48-api"
main = "src/index.ts"
compatibility_date = "2026-07-15"
compatibility_flags = ["nodejs_compat"]

# Se crea con: wrangler hyperdrive create teorico48-db --connection-string="<tu cadena de Neon>"
# y se pega aquí el id que te devuelva ese comando.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "REPLACE_WITH_HYPERDRIVE_ID"

# Se crea con: wrangler kv namespace create RATE_LIMIT_KV
# y se pega aquí el id que te devuelva ese comando.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
